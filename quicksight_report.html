<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickSight Report - Arrive Home</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
    }
    .header {
      background: #232f3e;
      color: white;
      padding: 1rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .container {
      padding: 1rem;
      max-width: 100%;
      height: calc(100vh - 56px);
    }
    .iframe-wrapper {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      height: 100%;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 800px;
      border: none;
    }
  </style>
</head>
<body>
  <header class="header">Arrive Home – QuickSight Report</header>
  <div class="container">
    <div class="iframe-wrapper">
      
    <iframe
    width="960"
    height="720"
    src="https://us-west-2.quicksight.aws.amazon.com/sn/embed/share/accounts/832403765688/dashboards/be19ceea-59d0-4722-bf5c-283679a7a064?directory_alias=arrive-home">
</iframe>
<iframe
  src="https://us-west-2.quicksight.aws.amazon.com/embed/dashboard/…?code=…"
  width="100%"
  height="800"
  frameborder="0"
  allowfullscreen
></iframe>
    </div>
  </div>
</body>
</html>
